name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "cooking-game/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "cooking-game/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cooking-game
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests (Windows)
        run: cargo test
      - name: Build release (Windows)
        run: cargo build --release
      - name: Bundle assets + exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/cooking-game.exe dist/
          Copy-Item -Recurse assets dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: short-order-showdown-windows
          path: cooking-game/dist
