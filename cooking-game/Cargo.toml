[package]
name = "cooking-game"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
bevy = { version = "0.16", features = ["mp3"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
bevy_embedded_assets = { version = "=0.13.0", optional = true }

[features]
default = []
embed-assets = ["bevy_embedded_assets"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
